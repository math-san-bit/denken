name: release

# タグ（v1、v2、…）の中身を、そのまま GitHub Pages に公開する。
# - タグを push すると、そのタグが公開される
# - 前の版に戻すときは、Actions の画面から「Run workflow」で戻したいタグを入れる
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '公開するタグ（例 v3）'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開するタグを取り出す
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - name: 公開する物だけを集める
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude=_site --exclude=.git --exclude=.github --exclude=.claude \
            --exclude='*.md'
          echo "公開するタグ: ${{ inputs.tag || github.ref_name }}（$(git rev-parse --short HEAD)）" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
