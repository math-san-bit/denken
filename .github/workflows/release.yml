name: release

# タグ（v1、v2、…）の中身を、公開用の site ブランチに写す。
# Cloudflare Pages は site ブランチを本番として公開する（https://hissandou.pages.dev/）。
# - タグを push すると、そのタグが公開される
# - 前の版に戻すときは、Actions の画面から「Run workflow」で戻したいタグを入れる
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '公開するタグ（例 v3）'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 公開するタグを取り出す
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 1

      - name: 検査
        run: python3 .github/scripts/check_site.py .

      - name: 公開する物だけを集める
        run: |
          mkdir /tmp/_site
          rsync -a ./ /tmp/_site/ \
            --exclude=.git --exclude=.github --exclude=.claude \
            --exclude='*.md'

      - name: site ブランチに写す
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          cd /tmp/_site
          git init -q -b site
          git config user.name "math-san"
          git config user.email "351488474+math-san-bit@users.noreply.github.com"
          git add -A
          git commit -q -m "公開: ${TAG}（${SHA}）"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site:site
          echo "公開するタグ: ${TAG}（${SHA}）→ site ブランチ → https://hissandou.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
