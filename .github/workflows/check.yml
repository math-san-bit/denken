name: check

# main へのプルリクエストごとに、リンク切れと頁の一覧を検査する。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: リンクと頁の一覧の検査
        run: python3 .github/scripts/check_site.py .
